# 個人リポジトリ共通の再利用可能ワークフロー
# （Seduce0068/workflows の rust-gates.yml）へ委譲する。
# native-tls（reqwest / oauth2 経由）のビルド用に libssl-dev を導入する。
# 依存監査（cargo audit）も有効化する。ignore は .cargo/audit.toml。
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  # advisory DB の更新はリポジトリへの push を伴わないため、
  # 定期実行でも cargo audit を走らせる（毎週月曜 00:00 UTC）。
  schedule:
    - cron: '0 0 * * 1'

# schedule と push が同じ master ref で衝突し定期 audit がキャンセルされないよう、
# イベント種別を group に含めて分離する。
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    uses: Seduce0068/workflows/.github/workflows/rust-gates.yml@v1
    with:
      apt_packages: |
        libssl-dev
      # Cargo.lock をコミット済みなので --locked を明示的に必須化する
      #（共通ワークフローの locked 既定値も true のため挙動は不変）
      locked: true
      audit: true
      # unsafe ブロックを lint で検出したらビルド失敗（workspace lint の
      # unsafe_code = "deny" に加え、clippy 側でも二重に担保する）
      clippy_args: -D clippy::undocumented_unsafe_blocks
      # 既定ゲートはデフォルト feature のみ。all-features（例: opencode-lsp の
      # feature 追加で 591→899 行の差分）も CI で検証する。
      # clippy は all-features 用に独立で再実行する。clippy_args は既定 feature の
      # 標準 clippy ゲートへ渡す入力なので、ここでは重複させず -D warnings を
      # 直接指定する（共通ワークフロー側の変更は不要・競合なし）。
      # unsafe 対策は二層で担保する。workspace lint の unsafe_code = "deny" は
      # unsafe の使用そのものをコンパイル時に拒否するのに対し、
      # clippy::undocumented_unsafe_blocks は #[allow(unsafe_code)] で例外を
      # 認めた FFI 境界等でも SAFETY コメントの欠落を検出する補完ゲートであり、
      # 既定 feature の clippy_args と同じく all-features 側にも明示付与する。
      # さらにリリースプロファイル（最適化有効）のビルドもゲートに含める。
      extra_gates: |
        cargo check --workspace --all-features --all-targets --locked
        cargo test --workspace --all-features --all-targets --locked
        cargo clippy --workspace --all-features --all-targets --locked -- -D warnings -D clippy::undocumented_unsafe_blocks
        cargo build --workspace --release --locked
