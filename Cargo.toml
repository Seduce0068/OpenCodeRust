[workspace]
resolver = "2"
members = [
    "crates/opencode-core",
    "crates/opencode-types",
    "crates/opencode-util",
    "crates/opencode-config",
    "crates/opencode-grep",
    "crates/opencode-permission",
    "crates/opencode-provider",
    "crates/opencode-session",
    "crates/opencode-storage",
    "crates/opencode-tool",
    "crates/opencode-agent",
    "crates/opencode-server",
    "crates/opencode-watcher",
    "crates/opencode-lsp",
    "crates/opencode-mcp",
    "crates/opencode-cli",
    "crates/opencode-command",
    "crates/opencode-plugin",
    "crates/opencode-tui",
    "crates/opencode-local-llm",
    "crates/opencode-codemode",
]

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
double_must_use = "allow"
for_kv_map = "allow"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OpenCode Team"]
license = "MIT"

[workspace.dependencies]
oxc_allocator = "=0.154.0"
oxc_ast = "=0.154.0"
oxc_parser = "=0.154.0"
oxc_span = "=0.154.0"
oxc_syntax = "=0.154.0"
indexmap = "2"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = { version = "1", features = [] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rand = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
lazy_static = "1.4"
regex = "1"
fancy-regex = "0.19"
glob = "0.3"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
notify = "8"
walkdir = "2"
nucleo-matcher = "=0.3.1"
syntect = { version = "=5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
similar = "=2.7.0"
dirs = "7"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
reqwest-eventsource = "0.6"
tokio-stream = "0.1"
tokio-util = "0.7"
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
which = "8"
parking_lot = "0.13"
url = "2.5"
lsp-types = "0.97"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
portable-pty = "0.9"
oauth2 = "5"
sha2 = "0.11"
base64 = "0.23"
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tempfile = "3.16.0"
dashmap = "6.1"
jsonc-parser = "0.34.0"
toml = "1.1"
