[package]
name = "opencode-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace crates
opencode-config = { path = "../opencode-config" }

# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
once_cell = { workspace = true }
walkdir = { workspace = true }
syntect = { workspace = true }

# TUI dependencies
# 既定 feature (all-widgets / macros / layout-cache / underline-color) は不要なため
# 無効化し、実際に使う crossterm (CrosstermBackend + std) のみを明示的に有効化する。
# TestBackend と ratatui-widgets の標準ウィジェットは feature 不要で常時利用可。
# ratatui-macros / calendar / underline_color は未使用。termina / termwiz 等の
# 未使用バックエンドも明示的に有効化しない限り有効にならない。
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
nucleo-matcher = { workspace = true }
similar = { workspace = true }

# Additional dependencies
futures = { workspace = true }
unicode-width = "0.2"
uuid = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
dirs = { workspace = true }
base64 = { workspace = true }
pulldown-cmark = "0.13"
