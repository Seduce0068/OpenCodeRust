# cargo-audit の設定。
# ignore は修正版が存在しない、または build graph に到達しない advisory に
# 限り、根拠をコメントで残して追加する。

[advisories]
ignore = [
    # rsa 0.9.10: Marvin Attack (RUSTSEC-2023-0071、2023-11)。
    # patched = [] で修正版は存在しない (2026-09 時点でも未修正)。
    # sqlx-mysql 経由で Cargo.lock にのみ存在し、本 workspace は sqlx の
    # sqlite feature のみを使うため build graph に含まれない
    # (cargo tree -i sqlx-mysql --target all は空)。
    "RUSTSEC-2023-0071",

    # libsqlite3-sys 0.37.0: C SQLite CVE-2026-119375
    # (RUSTSEC-2026-0459、2026-10-30、medium 6.8)。
    # patched = [">= 0.39.0"] だが、sqlx-sqlite 0.9.0 の依存制約が
    # `libsqlite3-sys >=0.30.1, <0.38.0` のため 0.39 以降を選べない。
    # sqlx 0.9.0 が最新 stable (2026-05-21 時点) で、互換な修正版は存在
    # しない。攻撃条件はローカルの攻撃者が細工した DB ファイルと `-wal` を
    # 置き、プロセスがそれを開くこと (AV:L / UI:P)。DB はユーザーの
    # データディレクトリ配下にあり、他者書込みは前提にしない。
    # sqlx が libsqlite3-sys >=0.39 を許容した時点で ignore を外す。
    "RUSTSEC-2026-0459",
]
